name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build (build.bat downloads yt-dlp + ffmpeg and runs PyInstaller)
        shell: cmd
        run: build.bat

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\FBLiveTranscriber\* -DestinationPath FBLiveTranscriber-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FBLiveTranscriber-win64
          path: FBLiveTranscriber-win64.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FBLiveTranscriber-win64.zip
